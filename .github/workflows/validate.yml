name: Validate plugin package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
      - name: Validate OpenAI plugin metadata
        run: |
          jq -e '.name == "publica-now" and .version == "1.1.0" and .mcpServers == "./.mcp.json" and .apps == "./.app.json" and .skills == "./skills/"' .codex-plugin/plugin.json
          jq -e '.apps["publica-now"].id == "asdk_app_6a913f0c05448191803319a783a9a347"' .app.json
          jq -e '.schema_version == 1 and (.test_cases | length) == 5 and (.negative_test_cases | length) == 3 and all(.tools[]; (.annotations.readOnlyHint | type) == "boolean" and (.annotations.openWorldHint | type) == "boolean" and (.annotations.destructiveHint | type) == "boolean")' chatgpt-app-submission.json

  ci-success:
    name: ci-success
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required checks passed
        run: test "${{ needs.validate.result }}" = "success"
